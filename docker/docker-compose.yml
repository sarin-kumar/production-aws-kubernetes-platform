services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ../app/backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://platform:local-dev-only@db:5432/platform
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ../app/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
